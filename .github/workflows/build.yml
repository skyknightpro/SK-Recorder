name: Build SK Recorder
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Fetch FFmpeg
        shell: pwsh
        run: |
          $ProgressPreference='SilentlyContinue'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff -Force
          New-Item -ItemType Directory bin -Force | Out-Null
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName bin\ffmpeg.exe
      - name: Build exe
        run: pyinstaller --noconfirm --clean "SK Recorder.spec"
      - uses: actions/upload-artifact@v4
        with: { name: SK-Recorder, path: "dist/SK Recorder.exe" }
      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SK Recorder.exe
